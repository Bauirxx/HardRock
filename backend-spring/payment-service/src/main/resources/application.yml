server:
  port: 8087

spring:
  application:
    name: payment-service
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/gym_payment_db
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

# ─── PaySuite (gateway de pagamentos) ───────────────────────────
paysuite:
  base-url: ${PAYSUITE_BASE_URL:https://paysuite.tech/api/v1}
  token: ${PAYSUITE_TOKEN:}
  webhook-secret: ${PAYSUITE_WEBHOOK_SECRET:}
  callback-url: ${PAYSUITE_CALLBACK_URL:}
  return-url: ${PAYSUITE_RETURN_URL:http://localhost:3000/pagamento/retorno}

jwt:
  secret: ${JWT_SECRET:gym-management-super-secret-key-that-is-at-least-256-bits-long}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
