spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:postgresql://gym-postgres:5432/gym_gym_db
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}

  rabbitmq:
    host: gym-rabbitmq
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

eureka:
  client:
    service-url:
      defaultZone: http://gym-eureka:8761/eureka/
