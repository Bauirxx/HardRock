server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                # Whitelist estrita de origens: definir em app.cors.allowed-origins (via env CORS_ALLOWED_ORIGINS).
                # NUNCA usar "*" com allowCredentials=true (viola CORS spec e permite CSRF cross-origin).
                allowedOrigins: ${app.cors.allowed-origins:http://localhost:3000,http://localhost:5173}
                allowedMethods: ["GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS"]
                allowedHeaders: ["Authorization", "Content-Type", "Accept", "X-Requested-With"]
                exposedHeaders: ["Authorization"]
                allowCredentials: true
                maxAge: 3600
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
          routes:
            # Auth Service (8081)
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - StripPrefix=0

            # Member Service (8082)
            - id: member-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/clientes/**,/api/v1/personal-trainers/**,/api/v1/leads/**,/api/v1/sessoes/**,/api/v1/notificacoes/**
              filters:
                - StripPrefix=0

            # Gym Service (8083)
            - id: gym-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/servicos/**,/api/v1/planos/**,/api/v1/testemunhos/**,/api/v1/pagamentos/**,/api/v1/configuracoes/**
              filters:
                - StripPrefix=0

            # Store Service (8084)
            - id: store-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/produtos/**,/api/v1/vendas/**
              filters:
                - StripPrefix=0

            # Notification Service (8085) — envio/teste de email
            - id: notification-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/v1/email/**
              filters:
                - StripPrefix=0

            # Payment Service (8087) — gateway de pagamentos PaySuite
            - id: payment-service
              uri: http://localhost:8087
              predicates:
                - Path=/api/v1/checkout/**
              filters:
                - StripPrefix=0

            # History Service (8086)
            - id: history-service
              uri: http://localhost:8086
              predicates:
                - Path=/api/v1/historico/**
              filters:
                - StripPrefix=0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
